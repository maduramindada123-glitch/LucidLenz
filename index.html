<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>One-Click Copy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; width: 320px; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .success { margin-top: 0.75rem; font-size: 0.875rem; color: #4ade80; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

<div class="card">
    <h3>One-Click Copy Tool</h3>
    <input type="text" id="copyInput" value="Text ready to be copied instantly!" />
    <button onclick="copyText()">Copy to Clipboard</button>
    <div id="msg" class="success">Copied successfully!</div>
</div>

<script>
function copyText() {
    const input = document.getElementById('copyInput');
    navigator.clipboard.writeText(input.value).then(() => {
        const msg = document.getElementById('msg');
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    });
}
</script>

</body>
</html>
